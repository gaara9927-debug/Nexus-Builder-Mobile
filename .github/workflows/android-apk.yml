name: Build Android APK
on: [push, workflow_dispatch]
jobs:
 apk:
  runs-on: ubuntu-24.04
  steps:
   - uses: actions/checkout@v4
   - uses: actions/setup-java@v4
     with:
      distribution: temurin
      java-version: '17'
   - name: Locate Android SDK
     run: |
      echo "ANDROID_HOME=$ANDROID_HOME"
      echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
      test -d "$ANDROID_HOME"
      ls "$ANDROID_HOME/cmdline-tools"
      SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
      test -n "$SDKMANAGER"
      echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"
   - name: Configure Android SDK
     run: |
      yes | "$SDKMANAGER" --sdk_root="$ANDROID_HOME" --licenses >/dev/null || true
      "$SDKMANAGER" --sdk_root="$ANDROID_HOME" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
   - uses: gradle/actions/setup-gradle@v4
     with:
      gradle-version: '8.9'
   - name: Build debug APK
     working-directory: android
     run: gradle :app:assembleDebug --stacktrace
   - name: Validate APK archive
     run: |
      test -s android/app/build/outputs/apk/debug/app-debug.apk
      unzip -t android/app/build/outputs/apk/debug/app-debug.apk
   - uses: actions/upload-artifact@v4
     with:
      name: Nexus-Builder-Mobile-APK
      path: android/app/build/outputs/apk/debug/app-debug.apk
