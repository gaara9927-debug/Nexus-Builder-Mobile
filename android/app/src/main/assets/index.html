<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nexus</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 80% -10%,#34498b 0,#10152d 28%,#050712 72%);color:#eef4ff;font:15px system-ui}.app{max-width:760px;margin:auto;padding:20px 16px 95px}.head{display:flex;justify-content:space-between;align-items:center}.brand{font-size:29px;font-weight:900;letter-spacing:4px}.sub,.muted{color:#9bacca}.orb{width:48px;height:48px;border-radius:50%;background:radial-gradient(circle at 35% 30%,white,#9eb2ff 9%,#694fd5 38%,#101737 70%);box-shadow:0 0 32px #778dff88}.card{margin:15px 0;padding:18px;border:1px solid #2a3a62;border-radius:22px;background:#10172bdc;box-shadow:0 16px 45px #0006}textarea,input,select{width:100%;padding:14px;margin:7px 0;background:#080d1d;color:#fff;border:1px solid #354a78;border-radius:14px;outline:0}textarea{min-height:112px}button{padding:12px 15px;border:0;border-radius:14px;color:white;font-weight:800;background:linear-gradient(135deg,#6788ff,#9a68ff)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tile{padding:16px;border-radius:17px;border:1px solid #293b64;background:#111a31}.ok{display:inline-block;padding:6px 10px;border-radius:99px;background:#12392f;color:#7affc3;font-size:12px}.page{display:none}.page.on{display:block}pre{white-space:pre-wrap;color:#c6d7ff}.nav{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:space-around;background:#080c19ef;border-top:1px solid #263653;padding:8px 3px max(9px,env(safe-area-inset-bottom));backdrop-filter:blur(14px)}.nav button{background:none;color:#b9c8e8;font-size:12px;padding:7px}.big{font-size:22px;font-weight:900}
</style></head><body><main class=app><header class=head><div><div class=brand>NEXUS</div><div class=sub>Builder Mobile</div></div><div class=orb></div></header>
<section id=home class="page on"><div class=card><span class=ok>● NATIVE CORE ATIVO</span><h2>Construa no celular</h2><textarea id=prompt placeholder="Ex.: crie um jogo simples chamado Lumina..."></textarea><button onclick=fromPrompt()>Construir</button><pre id=result>Pronta.</pre></div><div class=card><h3>Projeto rápido</h3><input id=name placeholder="Nome"><select id=type><option value=web>Web App</option><option value=game>Jogo HTML5</option><option value=general>Projeto geral</option></select><button onclick=create()>Criar projeto</button></div></section>
<section id=projects class=page><div class=card><h2>📂 Projetos</h2><button onclick=loadProjects()>Atualizar</button><div id=list></div></div></section>
<section id=tools class=page><div class=card><h2>🧰 Ferramentas</h2><div class=grid><div class=tile>💻 Código<br><small class=muted>Gerador local</small></div><div class=tile>🎮 Jogos<br><small class=muted>Template executável</small></div><div class=tile>📁 Workspace<br><small class=muted>Arquivos privados</small></div><div class=tile>🧠 Memória<br><small class=muted>Persistência local</small></div></div><h3>Salvar memória</h3><input id=memory placeholder="Uma anotação para a Nexus"><button onclick=saveMemory()>Salvar</button></div></section>
<section id=center class=page><div class=card><h2>📊 Central</h2><div id=sys></div><button onclick=system()>Atualizar</button></div></section></main>
<nav class=nav><button onclick=show('home')>✦<br>Builder</button><button onclick=show('projects')>📂<br>Projetos</button><button onclick=show('tools')>🧰<br>Tools</button><button onclick=show('center')>📊<br>Central</button></nav>
<script>
const native=()=>typeof NexusNative!=='undefined';
function show(x){document.querySelectorAll('.page').forEach(e=>e.classList.remove('on'));document.getElementById(x).classList.add('on');if(x==='projects')loadProjects();if(x==='center')system()}
function create(){if(!native())return alert('Bridge Android não carregou');let n=name.value.trim()||'Meu Projeto',t=type.value;let r=JSON.parse(NexusNative.createProject(n,t));result.textContent='✅ Projeto criado de verdade\n'+r.name+'\n📁 '+r.path;show('home')}
function fromPrompt(){let p=prompt.value.trim();if(!p)return;name.value=(p.match(/chamad[oa]\s+([\w -]+)/i)||[])[1]||p.slice(0,35);type.value=/jogo|game/i.test(p)?'game':'web';create()}
function loadProjects(){let a=native()?JSON.parse(NexusNative.listProjects()):[];list.innerHTML=a.length?a.map(x=>'<div class="tile" style="margin-top:10px">✦ '+x+'</div>').join(''):'<p class=muted>Nenhum projeto criado.</p>'}
function saveMemory(){if(native()&&memory.value.trim()){NexusNative.saveMemory(memory.value);memory.value='';alert('Memória salva localmente.')}}
function system(){if(!native()){sys.innerHTML='<p>Bridge indisponível.</p>';return}let x=JSON.parse(NexusNative.systemInfo());sys.innerHTML='<div class=grid><div class=tile><span class=muted>Dispositivo</span><div class=big>'+x.device+'</div></div><div class=tile><span class=muted>Android</span><div class=big>'+x.android+'</div></div><div class=tile>CPU: '+x.cores+' núcleos</div><div class=tile>ABI: '+x.abi+'</div><div class=tile>RAM JVM: '+x.maxMemoryMb+' MB</div></div>'}
system()
</script></body></html>
